services:
  nginx:
    build:
      context: ..
      dockerfile: Dockerfile
      target: nginx
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://example.com}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://example.com}
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - paid-access
    volumes:
      - caddydata:/data
      - caddyconfig:/config

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://example.com}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://example.com}
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
      - paid-access
    volumes:
      - ../runtime:/app/runtime

  paid-access:
    build:
      context: ..
      dockerfile: Dockerfile
      target: paid-access-runtime
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freedompost}
      POSTGRES_USER: ${POSTGRES_USER:-freedompost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
